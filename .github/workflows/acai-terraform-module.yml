name: ACAI TERRAFORM MODULE

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  tf_module_checks:
    uses: acai-solutions/github-workflows/.github/workflows/checks-tf-module.yml@main
    if: ${{ github.event_name == 'pull_request' || endsWith(github.ref_name, '_ai') }}
    with:
      tf_test_beds: '["AWS"]'
      tf_terratest_path: "_test/terratest"
      tf_terratest_examples_path: "_example"
      tf_ai_autofix_include: true
    secrets: inherit

    
  tf_module_release:
    uses: acai-solutions/github-workflows/.github/workflows/tf-module-release.yml@main
    if: ${{ github.event_name == 'push' }}
    secrets: inherit
